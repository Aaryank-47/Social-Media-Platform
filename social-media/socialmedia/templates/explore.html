{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Explore - Social Media</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        :root {
            --instagram-blue: #0095f6;
            --instagram-blue-hover: #0086db;
            --instagram-light-blue: #b2dffc;
            --instagram-gray: #8e8e8e;
            --instagram-light-gray: #fafafa;
            --instagram-border: #dbdbdb;
        }

        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Sidebar Styles */
        .sidebar {
            background-color: white;
            height: 100vh;
            position: fixed;
            width: 240px;
            border-right: 1px solid var(--instagram-border);
            padding: 0;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid var(--instagram-border);
        }

        .profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--instagram-border);
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-item {
            margin-bottom: 5px;
        }

        .nav-link {
            color: #262626;
            padding: 12px 24px;
            border-radius: 8px;
            margin: 0 12px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            background-color: rgba(0, 0, 0, 0.05);
            color: #262626;
        }

        .nav-link i {
            width: 24px;
            text-align: center;
            margin-right: 12px;
            font-size: 1.2rem;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 240px;
            padding: 30px 0;
            max-width: 935px;
            margin: 0 auto 0 240px;
        }

        /* Explore Grid */
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .explore-item {
            position: relative;
            aspect-ratio: 1/1;
            overflow: hidden;
        }

        .explore-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .explore-item:hover .explore-image {
            transform: scale(1.05);
        }

        .explore-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .explore-item:hover .explore-overlay {
            opacity: 1;
        }

        .explore-stats {
            color: white;
            display: flex;
            gap: 20px;
        }

        .explore-stat {
            display: flex;
            align-items: center;
        }

        .explore-stat i {
            margin-right: 5px;
        }

        /* Search Bar */
        .search-bar {
            background-color: white;
            border-radius: 8px;
            border: 1px solid var(--instagram-border);
            padding: 15px;
            margin-bottom: 24px;
        }

        .search-input {
            border: none;
            background: none;
            width: 100%;
            padding: 8px;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
        }

        /* Responsive Styles */
        @media (max-width: 992px) {
            .sidebar {
                width: 72px;
            }
            
            .sidebar-header h4, .nav-link span {
                display: none;
            }
            
            .nav-link {
                padding: 12px;
                text-align: center;
            }
            
            .nav-link i {
                margin-right: 0;
                font-size: 1.5rem;
            }
            
            .main-content {
                margin-left: 72px;
            }
        }

        @media (max-width: 768px) {
            .explore-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: fixed;
                bottom: 0;
                top: auto;
                border-top: 1px solid var(--instagram-border);
                border-right: none;
            }
            
            .sidebar-header {
                display: none;
            }
            
            .sidebar-nav {
                display: flex;
                justify-content: space-around;
                padding: 10px 0;
            }
            
            .nav-item {
                margin: 0;
            }
            
            .nav-link {
                padding: 8px;
                margin: 0;
            }
            
            .main-content {
                margin-left: 0;
                margin-bottom: 60px;
                padding: 10px 0;
            }
            
            .explore-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-md-2">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <img src="{{profile.profileimg.url}}" alt="Profile Picture" class="profile-pic">
                        <h4 class="mt-2"><a href="/profile/{{user}}" style="text-decoration:none; color: #262626;">@{{user}}</a></h4>
                    </div>
                    <div class="sidebar-nav">
                        <ul class="nav flex-column">
                            <li class="nav-item">
                                <a class="nav-link" href="/">
                                    <i class="fa-solid fa-house"></i> <span>Home</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/explore">
                                    <i class="fa-solid fa-compass"></i> <span>Explore</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#exampleModal3">
                                    <i class="fa-solid fa-magnifying-glass"></i> <span>Search</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#exampleModal">
                                    <i class="fa-solid fa-circle-plus"></i> <span>Create Post</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/profile/{{user}}">
                                    <i class="fa-solid fa-user"></i> <span>Profile</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/logoutt">
                                    <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10">
                <div class="main-content">
                    {% include "modal.html" %}
                    {% include "search.html" %}

                    <!-- Search Bar -->
                    <div class="search-bar">
                        <input type="text" class="search-input" placeholder="Search posts...">
                    </div>

                    <!-- Explore Grid -->
                    <div class="explore-grid">
                        {% for post in posts %}
                        <div class="explore-item">
                            <img src="{{post.image.url}}" alt="Post Image" class="explore-image">
                            <div class="explore-overlay">
                                <div class="explore-stats">
                                    <div class="explore-stat">
                                        <i class="fa-solid fa-heart"></i> {{post.no_of_likes}}
                                    </div>
                                    <div class="explore-stat">
                                        <i class="fa-solid fa-comment"></i> 0
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/app.js'%}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
